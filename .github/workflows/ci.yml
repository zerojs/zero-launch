name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build SwiftUpdater
        run: swift build --configuration release --arch arm64 --arch x86_64 --product SwiftUpdater
        working-directory: UpdaterScripts/SwiftUpdater

      - name: Build and test ZeroLaunch
        run: >-
          xcodebuild test
          -project LaunchNext.xcodeproj
          -scheme LaunchNext
          -configuration Debug
          -destination 'platform=macOS'
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
